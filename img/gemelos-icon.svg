<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gemelos de la Tierra">
  <!--
    ── UNA SOLA IDEA ──────────────────────────────────────────────────────────
    Un planeta con el filo iluminado por su estrella. Y nada más.

    La versión anterior llevaba estrellas de fondo, un anillo punteado, un halo,
    el planeta y una curva de luz. Cinco cosas. En el desplegable esto se ve a
    cien píxeles, y a ese tamaño cinco cosas no son cinco cosas: son una mancha.

    Aquí hay tres formas y dos colores. Se lee a treinta y dos píxeles.

    El truco del filo: se pinta el círculo entero iluminado y encima otro
    círculo oscuro desplazado. Lo que asoma por el borde es la media luna. Es
    como se ve de verdad un planeta que no es el tuyo — nunca de frente, siempre
    con su estrella pegándole de lado.

    Paleta: la de la web, verde #3ddc84 y cian #5eead4 sobre el fondo #070b09.
  -->
  <defs>
    <linearGradient id="filo" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#8ffbd8"/>
      <stop offset="45%"  stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
    <radialGradient id="aire" cx="42%" cy="36%">
      <stop offset="60%"  stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="88%"  stop-color="#5eead4" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1210"/>
      <stop offset="100%" stop-color="#070b09"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>

  <!-- La atmósfera: un aro de luz difusa justo por fuera del planeta. Es lo
       único que insinúa que tiene aire, y aquí el aire es medio argumento. -->
  <circle cx="256" cy="256" r="192" fill="url(#aire)"/>

  <!-- El planeta iluminado, entero. -->
  <circle cx="256" cy="256" r="164" fill="url(#filo)"/>

  <!-- Y la noche encima, desplazada. Lo que queda a la vista es el filo. -->
  <circle cx="292" cy="292" r="164" fill="#080d0b"/>
</svg>
